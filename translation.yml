# Translation problems — Propositional Logic
# Unit IV Practice (drawn from Carnap: uzquiano@usc.edu)
# Each entry encodes a single sentence with its reference translation.
# student_url: share with students (answer key hidden)
# instructor_url: use with ?key=show to view/edit reference translations

# Group 1 — Key: p: Smith is a flexible negotiator, q: Smith will agree terms, r: Robinson will meet the demands
- id: unit4-group-1-1
  label: "Unit IV Practice · Group 1 · 1"
  sentence: "Smith is a flexible negotiator but Robinson will not meet the demands."
  ref: "p∧¬r"
  key:
    p: "Smith is a flexible negotiator"
    q: "Smith will agree terms"
    r: "Robinson will meet the demands"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-1-2
  label: "Unit IV Practice · Group 1 · 2"
  sentence: "Smith will agree terms only if he is a flexible negotiator and Robinson meets the demands."
  ref: "q→(p∧r)"
  key:
    p: "Smith is a flexible negotiator"
    q: "Smith will agree terms"
    r: "Robinson will meet the demands"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-1-3
  label: "Unit IV Practice · Group 1 · 3"
  sentence: "Although Smith is not a flexible negotiator, he will agree terms if Robinson meets the demands."
  ref: "¬p∧(r→q)"
  key:
    p: "Smith is a flexible negotiator"
    q: "Smith will agree terms"
    r: "Robinson will meet the demands"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-1-4
  label: "Unit IV Practice · Group 1 · 4"
  sentence: "Smith will not agree terms unless he is a flexible negotiator."
  ref: "¬p→¬q"
  key:
    p: "Smith is a flexible negotiator"
    q: "Smith will agree terms"
    r: "Robinson will meet the demands"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-1-5
  label: "Unit IV Practice · Group 1 · 5"
  sentence: "Either Smith will agree terms or Robinson will meet the demands."
  ref: "q∨r"
  key:
    p: "Smith is a flexible negotiator"
    q: "Smith will agree terms"
    r: "Robinson will meet the demands"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

# Group 2 — Key: p: The tank is full, q: You turn the ignition key, r: The car will start
- id: unit4-group-2-1
  label: "Unit IV Practice · Group 2 · 1"
  sentence: "The car will start if you turn the ignition key and the tank is full."
  ref: "(q∧p)→r"
  key:
    p: "The tank is full"
    q: "You turn the ignition key"
    r: "The car will start"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-2-2
  label: "Unit IV Practice · Group 2 · 2"
  sentence: "The car will not start unless you turn the ignition key."
  ref: "¬q→¬r"
  key:
    p: "The tank is full"
    q: "You turn the ignition key"
    r: "The car will start"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-2-3
  label: "Unit IV Practice · Group 2 · 3"
  sentence: "The tank is not full if you turned the ignition key and the car did not start."
  ref: "(q∧¬r)→¬p"
  key:
    p: "The tank is full"
    q: "You turn the ignition key"
    r: "The car will start"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-2-4
  label: "Unit IV Practice · Group 2 · 4"
  sentence: "If the car failed to start, then you failed to turn the ignition key or the tank is not full."
  ref: "¬r→(¬q∨¬p)"
  key:
    p: "The tank is full"
    q: "You turn the ignition key"
    r: "The car will start"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-2-5
  label: "Unit IV Practice · Group 2 · 5"
  sentence: "The car will start only if you turn the ignition key."
  ref: "r→q"
  key:
    p: "The tank is full"
    q: "You turn the ignition key"
    r: "The car will start"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

# Group 3 — Key: p: The insurance company will cover the expenses, q: You are current with your premium payments, r: You can afford to cover the expenses
- id: unit4-group-3-1
  label: "Unit IV Practice · Group 3 · 1"
  sentence: "You cannot afford to cover the expenses, but you are current with your payments."
  ref: "¬r∧q"
  key:
    p: "The insurance company will cover the expenses"
    q: "You are current with your premium payments"
    r: "You can afford to cover the expenses"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-3-2
  label: "Unit IV Practice · Group 3 · 2"
  sentence: "If you cannot afford to cover the expenses, then the insurance company will cover them if you are current with your payments."
  ref: "¬r→(q→p)"
  key:
    p: "The insurance company will cover the expenses"
    q: "You are current with your premium payments"
    r: "You can afford to cover the expenses"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-3-3
  label: "Unit IV Practice · Group 3 · 3"
  sentence: "The insurance company will cover the expenses if, and only if, you are current with your payments and you cannot afford to cover the expenses yourself."
  ref: "(p→(q∧¬r))∧((q∧¬r)→p)"
  key:
    p: "The insurance company will cover the expenses"
    q: "You are current with your premium payments"
    r: "You can afford to cover the expenses"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-3-4
  label: "Unit IV Practice · Group 3 · 4"
  sentence: "You are current with your payments only if you can afford to cover the expenses yourself."
  ref: "q→r"
  key:
    p: "The insurance company will cover the expenses"
    q: "You are current with your premium payments"
    r: "You can afford to cover the expenses"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-3-5
  label: "Unit IV Practice · Group 3 · 5"
  sentence: "You are neither current with your payments nor can afford to cover the expenses yourself."
  ref: "¬q∧¬r"
  key:
    p: "The insurance company will cover the expenses"
    q: "You are current with your premium payments"
    r: "You can afford to cover the expenses"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

# Group 4 — Key: p: You will become rich, q: You buy a lottery ticket from me, r: The lottery is rigged, t: I'm part of the scheme
- id: unit4-group-4-1
  label: "Unit IV Practice · Group 4 · 1"
  sentence: "If the lottery is rigged, then you will become rich if you buy a ticket from me and I'm part of the scheme."
  ref: "r→((q∧t)→p)"
  key:
    p: "You will become rich"
    q: "You buy a lottery ticket from me"
    r: "The lottery is rigged"
    t: "I'm part of the scheme"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-4-2
  label: "Unit IV Practice · Group 4 · 2"
  sentence: "Unless I'm part of the scheme, you will not become rich if you buy a ticket from me."
  ref: "¬t→(q→¬p)"
  key:
    p: "You will become rich"
    q: "You buy a lottery ticket from me"
    r: "The lottery is rigged"
    t: "I'm part of the scheme"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-4-3
  label: "Unit IV Practice · Group 4 · 3"
  sentence: "You will neither become rich nor buy a ticket from me; otherwise, the lottery is rigged."
  ref: "(¬p∧¬q)∧(¬(¬p∧¬q)→r)"
  key:
    p: "You will become rich"
    q: "You buy a lottery ticket from me"
    r: "The lottery is rigged"
    t: "I'm part of the scheme"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-4-4
  label: "Unit IV Practice · Group 4 · 4"
  sentence: "It is not the case that you will become rich only if you buy a ticket from me."
  ref: "¬(p→q)"
  key:
    p: "You will become rich"
    q: "You buy a lottery ticket from me"
    r: "The lottery is rigged"
    t: "I'm part of the scheme"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"

- id: unit4-group-4-5
  label: "Unit IV Practice · Group 4 · 5"
  sentence: "I'm not part of the scheme and even if the lottery is rigged, you will not become rich if you buy a ticket from me."
  ref: "¬t∧(r→(q→¬p))"
  key:
    p: "You will become rich"
    q: "You buy a lottery ticket from me"
    r: "The lottery is rigged"
    t: "I'm part of the scheme"
  student_url: "https://prop-translation.pplx.app#v1:"
  instructor_url: "https://prop-translation.pplx.app?key=show#v1:"
